name: Build and publish apt repository

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório (script original)
        uses: actions/checkout@v4
        with:
          repository: sh4r10/zen-browser-debian
          path: builder

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build do .deb usando o script original
        run: |
          cd builder
          BUILD_SCRIPT=""
          for name in build.sh build debian-package.sh create-deb.sh package.sh; do
            FOUND=$(find . -maxdepth 2 -type f -name "$name" | head -n 1)
            [ -n "$FOUND" ] && { BUILD_SCRIPT="$FOUND"; break; }
          done
          [ -z "$BUILD_SCRIPT" ] && BUILD_SCRIPT=$(find . -maxdepth 2 -type f -name "*.sh" -executable | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "::error::Nenhum script de build encontrado."
            exit 1
          fi

          echo "Usando: $BUILD_SCRIPT"
          chmod +x "$BUILD_SCRIPT"
          ./"$BUILD_SCRIPT"

          find . -name "*.deb" -exec mv {} "$GITHUB_WORKSPACE"/ \;
          cd "$GITHUB_WORKSPACE"

          # Corrigir nome do ficheiro (adicionar _amd64 se faltar)
          for deb in *.deb; do
            if echo "$deb" | grep -Eq '^.*_(amd64|all|i386|arm64)\.deb$'; then
              echo "Nome já correto: $deb"
              continue
            fi
            arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "amd64")
            base=$(echo "$deb" | sed 's/\.deb$//')
            new_name="${base}_${arch}.deb"
            echo "Renomeando: $deb -> $new_name"
            mv "$deb" "$new_name"
          done

          ls -la ./*.deb

      - name: Criar estrutura do site APT
        run: |
          mkdir -p site/pool/main/z/zen-browser
          mkdir -p site/dists/stable/main/binary-amd64
          cp ./*.deb site/pool/main/z/zen-browser/

      - name: Importar chave GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          gpg --export --armor "$GPG_KEY_ID" > site/KEY.gpg

      - name: Gerar metadados APT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd site
          # Gerar Packages
          dpkg-scanpackages pool/main /dev/null 2>/dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          # Criar ficheiro de configuração para o Release
          cat > /tmp/ftp-release.conf << EOF
          APT::FTPArchive::Release::Origin "Zen Browser Unofficial";
          APT::FTPArchive::Release::Label "Zen Browser";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Unofficial Debian packages for Zen Browser";
          EOF

          cd dists/stable
          apt-ftparchive release -c=/tmp/ftp-release.conf . > Release

          # Assinar com GPG (usando passphrase via loopback)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
